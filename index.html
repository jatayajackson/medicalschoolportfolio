<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jataya Jackson — Medical Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  /* Natural Elegance — Sherwin-Williams */
  --bg:#EAE3D6;            /* Creamy */
  --surface:#F4EDE0;       /* Lighter napery */
  --card:#F6EFE4;          /* Card surface */
  --sidebar:#3D2C1E;       /* Grounded deepened */
  --sb-hover:#4D3C2C;
  --sb-active:#5D4A38;
  --sb-text:#DDD0B8;       /* Creamy on dark */
  --sb-dim:#8A7260;
  --clay:#AF8B57;          /* Warm Clay — primary accent */
  --clay-d:#8A6C3A;
  --clay-l:#EDE0C6;        /* Napery light */
  --sage:#6A8A68;          /* Jadite deepened */
  --sage-l:#C4D8C0;        /* Easy Green light */
  --gold:#AF8B57;          /* Same as clay */
  --gold-l:#EDE0C6;
  --slate:#5A6E7A;         /* Smoky Blue */
  --navy:#2B415F;          /* Deep Slate */
  --text:#3D2C1E;          /* Grounded — body text */
  --text2:#7A6450;         /* Khaki/taupe */
  --text3:#A89278;
  --border:#CCC0A8;        /* Khaki border */
  --border-l:#DDD4C0;
  --danger:#8B3028;--danger-l:#F5E0D8;
  --ok:#486840;--ok-l:#D8EED0;
  --warn:#8B5E28;--warn-l:#F0E4D0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;font-size:14px;line-height:1.6}

/* Sidebar */
aside{width:230px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;height:100vh;overflow-y:auto;border-right:1px solid rgba(0,0,0,0.3);transition:width 0.25s ease,padding 0.25s ease;position:relative}
aside.collapsed{width:48px;overflow:hidden}
aside.collapsed .s-profile,aside.collapsed .n-sect,aside.collapsed .n-item span,aside.collapsed .sync-panel{opacity:0;pointer-events:none}
aside.collapsed .n-item{justify-content:center;padding:10px 0}
aside.collapsed .n-item i{width:auto;font-size:18px}
.collapse-btn{position:absolute;top:14px;right:10px;background:none;border:none;color:var(--sb-dim);cursor:pointer;font-size:16px;padding:4px;border-radius:4px;transition:all 0.15s;z-index:10;line-height:1}
.collapse-btn:hover{color:var(--sb-text);background:var(--sb-hover)}
aside.collapsed .collapse-btn{right:50%;transform:translateX(50%)}
body.sidebar-collapsed main{padding-left:2.5rem}
aside::before{content:'';display:block;height:3px;background:linear-gradient(90deg,#AF8B57,#8DA487,#5A6E7A);flex-shrink:0}
.s-profile{padding:0 1.25rem 1.25rem;border-bottom:1px solid rgba(255,255,255,0.07)}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:top center;margin-bottom:14px;flex-shrink:0;display:block;border:3px solid rgba(255,255,255,0.22);box-shadow:0 4px 16px rgba(0,0,0,0.45);}
.s-name{font-family:'Playfair Display',serif;font-size:16px;color:#EDE6D4;letter-spacing:0.01em;line-height:1.3}
.s-sub{font-size:11px;color:var(--sb-dim);margin-top:3px;line-height:1.6}
.s-sub em{color:var(--clay);font-style:normal;font-weight:500}

/* Journey */
.journey{padding:1.25rem;border-bottom:1px solid rgba(255,255,255,0.06)}
.j-title{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--sb-dim);margin-bottom:14px}
.j-wrap{position:relative;padding-left:22px}
.j-wrap::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:linear-gradient(to bottom,#AF8B57 0%,rgba(109,138,103,0.3) 60%,rgba(255,255,255,0.04) 100%)}
.j-stop{position:relative;margin-bottom:14px}
.j-stop:last-child{margin-bottom:0}
.j-dot{position:absolute;left:-22px;top:5px;width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);background:var(--sidebar)}
.j-stop.now .j-dot{background:var(--clay);border-color:var(--clay);box-shadow:0 0 10px rgba(175,139,87,0.6)}
.j-lbl{font-size:12px;color:var(--sb-dim)}
.j-stop.now .j-lbl{color:#EEE4D4;font-weight:500}
.j-date{font-size:10px;color:var(--sb-dim);opacity:0.55;margin-top:1px}
.j-stop.now .j-date{color:var(--clay);opacity:1}

/* Countdown */
.countdown{padding:0.875rem 1.25rem;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:baseline;gap:6px}
.cd-num{font-family:'Playfair Display',serif;font-size:28px;color:var(--clay);line-height:1}
.cd-lbl{font-size:10px;color:var(--sb-dim);text-transform:uppercase;letter-spacing:0.07em}

/* Nav */
nav{padding:0.5rem 0;flex:1}
.n-sect{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--sb-dim);padding:0.875rem 1.25rem 0.3rem}
.n-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 1.25rem;font-size:13px;color:var(--sb-dim);background:none;border:none;border-left:2px solid transparent;cursor:pointer;text-align:left;transition:all 0.15s;font-family:'Inter',sans-serif}
.n-item:hover{background:var(--sb-hover);color:var(--sb-text)}
.n-item.active{background:var(--sb-active);color:#F0E8D4;border-left-color:var(--clay);font-weight:500;letter-spacing:0.01em}
.n-item i{font-size:16px;width:18px;text-align:center}

/* Main */
main{flex:1;overflow-y:auto;height:100vh;padding:2.25rem 2.5rem;background:var(--bg);letter-spacing:0.005em;min-width:0;transition:padding 0.25s ease}
.pg-head{margin-bottom:1.75rem}
.pg-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:500;color:var(--text);margin-bottom:3px;letter-spacing:0.01em}
.pg-sub{color:var(--text2);font-size:13px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card:last-child{margin-bottom:0}
.card-title{font-weight:500;font-size:14px;margin-bottom:3px}
.card-sub{font-size:12px;color:var(--text2)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:1.75rem}
.stat{background:var(--surface);border:1px solid var(--border-l);border-radius:8px;padding:1rem;border-top:2px solid var(--border)}
.stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text2);margin-bottom:5px}
.stat-val{font-family:'Playfair Display',serif;font-size:27px;color:var(--text);line-height:1}
.stat-hint{font-size:11px;color:var(--text3);margin-top:4px}

/* Progress */
.prog-wrap{background:var(--border-l);border-radius:999px;height:6px;overflow:hidden;margin:7px 0}
.prog-bar{height:100%;border-radius:999px;background:var(--clay);transition:width 0.5s ease}
.prog-bar.sage{background:#6A8A68}
.prog-bar.gold{background:#AF8B57}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}

/* Tags */
.tag{display:inline-block;border-radius:4px;font-size:11px;font-weight:500;padding:2px 8px;white-space:nowrap}
.t-Research{background:#F3E8E0;color:#7A3520}
.t-Shadowing{background:#E2EDD8;color:#3A5825}
.t-Conferences{background:#E8E0F0;color:#4A2878}
.t-Boards{background:#F5E0DC;color:#7A2020}
.t-LORs{background:var(--gold-l);color:#6A5010}
.t-Clinical{background:#D8EEF0;color:#1A5060}
.t-Networking{background:#F0E0D8;color:#6A3010}
.t-Application{background:#E8E8E0;color:#404038}

/* Badges */
.badge{display:inline-block;border-radius:4px;font-size:11px;font-weight:500;padding:2px 8px;white-space:nowrap}
.b-ok{background:#D8EED0;color:#3A5830}
.b-warn{background:#F0E4D0;color:#7A5028}
.b-neutral{background:#E4DDD0;color:#7A6450}
.b-danger{background:#F5E0D8;color:#8B3028}

/* List */
.list-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-l)}
.list-row:last-child{border-bottom:none;padding-bottom:0}
.list-row:first-child{padding-top:0}
.list-main{flex:1;min-width:0}
.list-title{font-size:13px;font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:11px;color:var(--text2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;white-space:nowrap}
.btn-outline{background:none;border:1px solid #CCC0A8;color:#7A6450}
.btn-outline:hover{border-color:#AF8B57;color:#8A6C3A;background:#EDE0C6}
.btn-primary{background:#AF8B57;border:1px solid #9A7A48;color:#fff;font-weight:500}
.btn-primary:hover{background:#8A6C3A}
.btn-ghost{background:none;border:none;cursor:pointer;color:var(--text3);padding:3px;font-size:15px;border-radius:4px;line-height:1;transition:all 0.15s;flex-shrink:0}
.btn-ghost:hover{color:var(--danger);background:var(--danger-l)}
.btn-edit{background:none;border:none;cursor:pointer;color:var(--text3);padding:3px;font-size:15px;border-radius:4px;line-height:1;transition:all 0.15s;flex-shrink:0}
.btn-edit:hover{color:var(--clay);background:var(--clay-l)}

/* Checkbox */
input[type=checkbox]{accent-color:#AF8B57;width:15px;height:15px;cursor:pointer;flex-shrink:0;margin-top:3px}

/* Done text */
.done-text{text-decoration:line-through;color:var(--text2)}

/* Urgent */
.pill{border-radius:6px;padding:3px 8px;font-size:12px;font-weight:500;text-align:center;min-width:48px}
.pill-urgent{background:#F5E0D8;color:#8B3028}
.pill-normal{background:#E0D8C8;color:#7A6450}
.pill-done{background:#D4EAD0;color:#486840}

/* Alert */
.alert{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-warn{background:#F0E8D4;color:#6A4A20;border:1px solid #C4A878}
.alert i{font-size:15px;margin-top:1px;flex-shrink:0}

/* Empty */
.empty{text-align:center;padding:2rem;color:var(--text2);font-size:13px;font-style:italic}

/* Board score rows */
.board-row{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.board-input{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Inter',sans-serif;background:var(--surface);color:var(--text);width:170px;transition:border-color 0.15s}
.board-input:focus{outline:none;border-color:#AF8B57}
.score-ok{color:#486840;font-size:12px;font-weight:500}
.score-low{color:#8B3028;font-size:12px;font-weight:500}

/* Detail block */
.detail-block{border-left:2px solid var(--border);padding-left:12px;margin-top:8px;font-size:12px;color:var(--text2);line-height:1.7}
.detail-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin-bottom:6px}
.detail-kv dt{color:var(--text2);font-weight:500;white-space:nowrap}
.detail-kv dd{color:var(--text)}

/* Modal */
.m-overlay{position:fixed;inset:0;background:rgba(30,18,9,0.55);display:none;align-items:flex-start;justify-content:center;padding-top:50px;z-index:1000;overflow-y:auto}
.m-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:90%;max-width:510px;margin-bottom:3rem}
.m-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;margin-bottom:1.25rem;color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);font-family:'Inter',sans-serif;transition:border-color 0.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#AF8B57}
.field textarea{resize:vertical;min-height:72px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

/* Phase header */
.phase-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.phase-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:500}
.phase-pct{font-size:12px;color:var(--text2)}

/* Home page */
.home-hero{display:flex;gap:2.5rem;align-items:flex-start;margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.home-photo{width:160px;height:160px;border-radius:50%;object-fit:cover;object-position:top center;flex-shrink:0;border:4px solid var(--card);box-shadow:0 6px 24px rgba(0,0,0,0.15);margin-top:4px}
.home-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:500;line-height:1.2;margin-bottom:6px;color:var(--text)}
.home-tag{display:inline-block;font-size:12px;color:var(--clay);font-weight:500;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:14px}
.home-bio{font-size:14px;line-height:1.85;color:var(--text2);max-width:580px}
.home-section{margin-bottom:1.75rem}
.home-section-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;margin-bottom:1rem;color:var(--text);display:flex;align-items:center;gap:10px}
.home-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.edu-item{display:flex;gap:1rem;padding:0.875rem 0;border-bottom:1px solid var(--border-l)}
.edu-item:last-child{border-bottom:none}
.edu-dot{width:10px;height:10px;border-radius:50%;background:var(--clay);flex-shrink:0;margin-top:5px}
.edu-school{font-weight:500;font-size:14px;margin-bottom:2px}
.edu-detail{font-size:12px;color:var(--text2);line-height:1.6}
.home-edit-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.home-edit-btn:hover{border-color:var(--clay);color:var(--clay)}
.focus-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;display:flex;gap:1rem;align-items:flex-start;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.focus-icon{width:40px;height:40px;border-radius:8px;background:var(--clay-l);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--clay);flex-shrink:0}

/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}

/* ── MOBILE HEADER ── */
.mob-header{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:var(--sidebar);z-index:200;align-items:center;padding:0 1rem;gap:12px;border-bottom:1px solid rgba(255,255,255,0.08)}
.mob-header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#AF8B57,#8DA487,#5A6E7A)}
.mob-title{font-family:'Playfair Display',serif;font-size:15px;color:#EEE8D8;flex:1;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-back{background:none;border:none;color:var(--sb-dim);font-size:22px;cursor:pointer;padding:4px;line-height:1;display:none;align-items:center}
.mob-back.visible{display:flex}
.mob-hamburger{background:none;border:none;color:var(--sb-dim);cursor:pointer;padding:4px;line-height:1;display:flex;flex-direction:column;gap:5px;justify-content:center;flex-shrink:0}
.mob-hamburger span{display:block;width:22px;height:2px;background:var(--sb-dim);border-radius:2px;transition:all 0.2s}
.mob-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);background:var(--clay)}
.mob-hamburger.open span:nth-child(2){opacity:0}
.mob-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);background:var(--clay)}

/* ── SIDEBAR OVERLAY ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150}
.sidebar-overlay.open{display:block}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  html,body{overflow:auto}
  body{flex-direction:column}
  .mob-header{display:flex}
  aside{position:fixed;top:0;left:-270px;width:270px;height:100%;z-index:160;transition:left 0.25s ease;box-shadow:4px 0 20px rgba(0,0,0,0.4);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px}
  aside.open{left:0}
  main{margin-top:52px;height:auto;min-height:calc(100vh - 52px);padding:1.25rem 1rem;overflow-y:auto}
  .home-hero{flex-direction:column;align-items:center;text-align:center;gap:1.25rem}
  .home-photo{width:120px;height:120px}
  .home-bio{font-size:13px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .f-row{grid-template-columns:1fr}
  .modal{width:95%;padding:1.25rem}
  .m-overlay{padding-top:20px;padding-left:8px;padding-right:8px}
  .board-row{flex-wrap:wrap}
  .board-input{width:100%}
  .pg-head>div{flex-direction:column;gap:10px;align-items:flex-start}
  .list-row{flex-wrap:wrap;gap:8px}
  .phase-hd{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="mob-header">
  <button class="mob-back" id="mobBack" onclick="mobGoBack()"><i class="ti ti-arrow-left"></i></button>
  <div class="mob-title" id="mobTitle">Jataya Jackson</div>
  <button class="mob-hamburger" id="mobMenu" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside id="sidebar">

let state = null;
let tab = 'home';

/* ---- STORAGE (localStorage cache + Supabase as source of truth) ---- */
function lsGet(k){try{return localStorage.getItem(k);}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}

function backfillDefaults(){
  // Ensure any new top-level sections added to DEFAULT after a user's data
  // was already saved get initialized, without touching existing data.
  for(const k in DEFAULT){
    if(state[k]===undefined){
      state[k]=structuredClone(DEFAULT[k]);
    } else if(Array.isArray(DEFAULT[k]) && Array.isArray(state[k])){
      // Also merge in any newly-added default items (matched by id) into
      // arrays the user already has data in, e.g. new goals added later,
      // without duplicating or touching existing/edited items.
      const existingIds = new Set(state[k].map(x=>x&&x.id));
      DEFAULT[k].forEach(item=>{
        if(item&&item.id!==undefined&&!existingIds.has(item.id)) state[k].push(structuredClone(item));
      });
    }
  }
}

async function load(){
  let loaded=false;
  try{
    // Try Supabase first
    const r = await fetch(SB_URL+'/rest/v1/portfolio_data?id=eq.'+SB_ROW+'&select=data', {
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    if(r.ok){
      const rows = await r.json();
      if(rows.length && rows[0].data && Object.keys(rows[0].data).length > 0){
        state = rows[0].data;
        loaded=true;
      }
    }
  } catch(e){ console.warn('Supabase load failed, falling back to localStorage', e); }
  if(!loaded){
    // Fallback to localStorage
    try{
      const raw = lsGet(KEY);
      state = raw ? JSON.parse(raw) : structuredClone(DEFAULT);
    } catch{ state = structuredClone(DEFAULT); }
  }
  backfillDefaults();
  lsSet(KEY, JSON.stringify(state));
}

async function save(){
  // Save to localStorage immediately
  try{ lsSet(KEY, JSON.stringify(state)); } catch{}
  // Save to Supabase in background
  try{
    await fetch(SB_URL+'/rest/v1/portfolio_data', {
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':'Bearer '+SB_KEY,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates'
      },
      body: JSON.stringify({id:SB_ROW, data:state, updated_at: new Date().toISOString()})
    });
  } catch(e){ console.warn('Supabase save failed:', e); }
}

function showToast(msg, isError=false){
  const t = document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;padding:10px 18px;border-radius:8px;font-size:13px;font-family:Inter,sans-serif;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.2);background:'+(isError?'#8B3028':'#486840')+';color:#fff';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.4s';setTimeout(()=>t.remove(),400);},2800);
}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portfolio_backup.json';a.click();
}

function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{state=JSON.parse(ev.target.result);lsSet(KEY,JSON.stringify(state));navigate(tab);showToast('Data imported successfully');}
      catch{showToast('Invalid file',true);}
    };reader.readAsText(file);
  };input.click();
}

function badgeClass(s){
  if(!s) return 'b-neutral';
  if(/Published|Pass|Complet|Receiv|Accept/.test(s)) return 'b-ok';
  if(/Progress|Review|Revision|Submit|Planned/.test(s)) return 'b-warn';
  if(/Fail|Declin/.test(s)) return 'b-danger';
  return 'b-neutral';
}

/* ---- FILE ATTACHMENTS (multiple, stored as base64, e.g. shadowing/service evaluations) ---- */
function attRow(name,url,id,source,idx){
  return `<div style="display:flex;align-items:center;gap:6px;font-size:12px;background:var(--surface);border:1px solid var(--border-l);border-radius:6px;padding:4px 8px">
    <i class="ti ${source==='pendingLinks'?'ti-link':'ti-paperclip'}" style="color:var(--clay);font-size:13px;flex-shrink:0"></i>
    <a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</a>
    <button type="button" onclick="removeAttachment('${id}','${source}',${idx})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;line-height:1;padding:0 2px;flex-shrink:0" title="Remove">&times;</button>
  </div>`;
}
function attachmentStatusHTML(id){
  const existing=(window._existingAtt&&window._existingAtt[id])||[];
  const pf=(window._pendingFiles&&window._pendingFiles[id])||[];
  const pl=(window._pendingLinks&&window._pendingLinks[id])||[];
  if(!existing.length&&!pf.length&&!pl.length) return `<div style="font-size:11px;color:var(--text2)">No files attached yet (max 4MB per file — PDF, Word doc, or image; add as many as you need)</div>`;
  return existing.map((a,i)=>attRow(a.name,a.data||a.link,id,'existing',i)).join('')
    + pf.map((f,i)=>attRow(f.name+' (new)',f.data,id,'pendingFiles',i)).join('')
    + pl.map((l,i)=>attRow(l+' (new link)',l,id,'pendingLinks',i)).join('');
}
function refreshAttachmentStatus(id){
  const el=document.getElementById(id+'_status');
  if(el) el.innerHTML=attachmentStatusHTML(id);
}
function removeAttachment(id,source,idx){
  const map={existing:'_existingAtt',pendingFiles:'_pendingFiles',pendingLinks:'_pendingLinks'};
  if(window[map[source]]&&window[map[source]][id]) window[map[source]][id].splice(idx,1);
  refreshAttachmentStatus(id);
}
function handleFilesSelect(e,id){
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  window._pendingFiles=window._pendingFiles||{};
  window._pendingFiles[id]=window._pendingFiles[id]||[];
  files.forEach(file=>{
    if(file.size>4*1024*1024){ showToast('Skipped '+file.name+' — over 4MB', true); return; }
    const reader=new FileReader();
    reader.onload=()=>{
      window._pendingFiles[id].push({name:file.name, data:reader.result});
      refreshAttachmentStatus(id);
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}
function addAttachmentLink(id){
  const inp=document.getElementById(id+'_linkinput');
  const v=(inp?.value||'').trim();
  if(!v) return;
  window._pendingLinks=window._pendingLinks||{};
  window._pendingLinks[id]=window._pendingLinks[id]||[];
  window._pendingLinks[id].push(v);
  if(inp) inp.value='';
  refreshAttachmentStatus(id);
}
function fileField(label,id,item){
  window._existingAtt=window._existingAtt||{};
  window._pendingFiles=window._pendingFiles||{};
  window._pendingLinks=window._pendingLinks||{};
  window._existingAtt[id]=(item?.attachments||[]).map(a=>({...a}));
  window._pendingFiles[id]=[];
  window._pendingLinks[id]=[];
  return `<div class="field">
    <label>${label}</label>
    <input type="file" id="${id}" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic" onchange="handleFilesSelect(event,'${id}')">
    <div style="display:flex;gap:6px;margin-top:6px">
      <input type="text" id="${id}_linkinput" placeholder="Paste a link (Google Drive, Dropbox, etc.)" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--surface);color:var(--text);font-family:'Inter',sans-serif">
      <button type="button" class="btn btn-outline" style="padding:5px 10px;font-size:11px;flex-shrink:0" onclick="addAttachmentLink('${id}')">Add link</button>
    </div>
    <div id="${id}_status" style="margin-top:8px;display:flex;flex-direction:column;gap:5px">${attachmentStatusHTML(id)}</div>
  </div>`;
}
function resolveAttachments(id){
  const existing=(window._existingAtt&&window._existingAtt[id])||[];
  const pf=(window._pendingFiles&&window._pendingFiles[id])||[];
  const pl=(window._pendingLinks&&window._pendingLinks[id])||[];
  return [...existing, ...pf.map(f=>({name:f.name,data:f.data})), ...pl.map(l=>({name:l,link:l}))];
}
function attachmentsList(item){
  const atts=item.attachments||[];
  if(!atts.length) return '';
  return `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px">${atts.map(a=>`<a href="${esc(a.data||a.link)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--clay);background:var(--clay-l);border-radius:4px;padding:2px 7px;text-decoration:none;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="ti ${a.link&&!a.data?'ti-link':'ti-paperclip'}" style="font-size:11px;flex-shrink:0"></i>${esc(a.name)}</a>`).join('')}</div>`;
}

const RESEARCH_START = new Date('2026-06-22');
function weekNum(){ return Math.max(1, Math.ceil((new Date()-RESEARCH_START)/(7*864e5))); }
function nextUnloggedWeek(){
  // Returns the next week number that hasn't been logged yet
  const logged = new Set((state.researchLog||[]).map(e=>e.weekNum));
  const current = weekNum();
  // Find lowest unlogged week up to current
  for(let w=1; w<=current; w++){
    if(!logged.has(w)) return w;
  }
  // All weeks up to current are logged — return next week
  return current + 1;
}
function toDateStr(d){ return d.toISOString().split('T')[0]; }
function fmtFull(d){ if(!d)return''; try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}catch{return d;} }

function renderResearchLog(){
  const now=new Date();
  const wk=weekNum();
  const sorted=[...state.researchLog].sort((a,b)=>new Date(b.weekStart)-new Date(a.weekStart));
  const thisWeekLogged=sorted.find(e=>{

function openLogModal(id=null){
  const item=id?state.researchLog.find(e=>e.id===id):null;
  const now=new Date();
  const wk=item?item.weekNum:nextUnloggedWeek();
  // Calculate the Monday of the target week
  const weekOffset = wk - weekNum();
  const targetDate = new Date(now);
  targetDate.setDate(now.getDate() + (weekOffset * 7));
  const dayOfWeek=targetDate.getDay();
  const mon=new Date(targetDate);
  mon.setDate(targetDate.getDate()-(dayOfWeek===0?6:dayOfWeek-1));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const title=item?`Edit Week ${item.weekNum} Log`:`Log Week ${wk}`;
  const body=`
    <div class="f-row">
      ${fld('Week number','f_wnum','number','min="1"',String(item?.weekNum||wk))}
      ${fld('Week start (Monday)','f_wstart','date','',item?.weekStart||toDateStr(mon))}
    </div>
    ${fld('Week end (Sunday)','f_wend','date','',item?.weekEnd||toDateStr(sun))}
    ${ftxt('✓ Email sent to mentor','f_comp',item?.completed||'')}
    ${ftxt('⟳ In progress','f_inp',item?.inProgress||'')}
    ${ftxt('⚠ Blockers / questions for Dr. Riskin','f_blk',item?.blockers||'')}
    ${ftxt('→ Next week\'s plan','f_nxt',item?.nextWeek||'')}
  `;
  openOverlay(title,body,()=>{
    if(!val('f_wstart'))return;
    const updated={id:item?.id||uid(),weekNum:parseInt(val('f_wnum'))||wk,weekStart:val('f_wstart'),weekEnd:val('f_wend'),completed:val('f_comp'),inProgress:val('f_inp'),blockers:val('f_blk'),nextWeek:val('f_nxt'),emailSent:item?.emailSent||false};
    if(item){state.researchLog=state.researchLog.map(e=>e.id===item.id?updated:e);}
    else{state.researchLog.push(updated);}
    state.researchLog.sort((a,b)=>new Date(b.weekStart)-new Date(a.weekStart));
    save();closeModal();navigate(tab);
  });
}

function pieChartSVG(data,size){
  size=size||150;
  const total=data.reduce((s,d)=>s+d.value,0);
  const cx=size/2, cy=size/2, r=size/2-3;
  if(!total) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--border-l)"/></svg>`;
  const nonzero=data.filter(d=>d.value>0);
  if(nonzero.length===1) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${nonzero[0].color}"/></svg>`;
  let startAngle=-Math.PI/2, paths='';
  data.forEach(d=>{
    if(d.value<=0) return;
    const angle=(d.value/total)*Math.PI*2, endAngle=startAngle+angle;
    const x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle), y2=cy+r*Math.sin(endAngle);
    const largeArc=angle>Math.PI?1:0;
    paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${d.color}"/>`;
    startAngle=endAngle;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}
function renderStudyLog(){

      const expanded=window._expandedMasteryGroups && window._expandedMasteryGroups.has(key);
      const groupItems=sorted.filter(x=>examGroup(x)===g);
      const gEsc=esc(g).replace(/'/g,"\\'"), fEsc=esc(filter).replace(/'/g,"\\'"), kEsc=esc(key).replace(/'/g,"\\'");
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:1.5rem 0 0.75rem;padding-bottom:6px;border-bottom:1px solid var(--border)">
        <div style="font-family:'Playfair Display',serif;font-size:14px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:8px">
          ${esc(g)}
          ${done?`<span class="badge b-ok" style="font-size:10px"><i class="ti ti-check" style="font-size:10px;vertical-align:-1px"></i> Completed</span>`:''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          ${done?`<button class="btn btn-outline" style="padding:3px 10px;font-size:11px" onclick="toggleGroupExpanded('${kEsc}')">${expanded?'Hide lectures':`Show ${groupItems.length} lecture${groupItems.length!==1?'s':''}`}</button>`:''}
          <button class="btn btn-outline" style="padding:3px 10px;font-size:11px;${done?'background:var(--ok-l);color:var(--ok);border-color:var(--ok)':''}" onclick="toggleExamGroupDone('${fEsc}','${gEsc}')">${done?'✓ Exam done':'Mark exam complete'}</button>
        </div>
      </div>`;
      if(!done||expanded) html+=groupItems.map(lectureCard).join('');
    });
    const ungrouped=sorted.filter(x=>!examGroup(x));
    if(ungrouped.length){
      html+=`<div style="font-family:'Playfair Display',serif;font-size:14px;font-weight:500;color:var(--text2);margin:1.5rem 0 0.75rem;padding-bottom:6px;border-bottom:1px solid var(--border)">Ungrouped</div>`;
      html+=ungrouped.map(lectureCard).join('');
    }
  } else {
    html+=sorted.map(lectureCard).join('');
  }

  return html;
}

function renderSchedule(){
  const now=new Date();
  const sorted=[...state.exams].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const remaining=sorted.filter(e=>!e.done);
  const done=state.exams.filter(e=>e.done).length;
  const next=remaining[0];
  const pct=state.exams.length?Math.round(done/state.exams.length*100):0;

  let html=pgHead('Fall 2026 Schedule',`${state.exams.length} assessments · ${remaining.length} remaining`,'Add event',"openModal('exam')");

  if(next){
    const dd=Math.ceil((new Date(next.date)-now)/864e5);
    const urgColor=dd<=3?'var(--danger)':dd<=7?'var(--warn)':'var(--sage)';
    html+=`<div class="card" style="margin-bottom:1.25rem;border-left:4px solid ${courseColor(next.course)};padding-left:1rem">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.09em;color:var(--text2);margin-bottom:4px">Next assessment</div>
      <div style="font-weight:500;font-size:15px;font-family:'Playfair Display',serif">${esc(next.course)}</div>
      <div style="font-size:13px;color:var(--text2);margin-top:2px">${esc(next.type)} &middot; ${fmt(next.date)}${next.time?' at '+esc(next.time):''}</div>
      <div style="margin-top:8px;font-size:14px;font-weight:500;color:${urgColor}">${dd<=0?'Today!':dd===1?'Tomorrow':dd+' days away'}</div>
    </div>`;
  }

  html+=`<div class="card" style="margin-bottom:1.5rem">
    <div class="prog-meta"><span style="font-weight:500">Semester progress</span><span>${done}/${state.exams.length} complete &middot; ${pct}%</span></div>
    <div class="prog-wrap"><div class="prog-bar gold" style="width:${pct}%"></div></div>
  </div>`;

  const months={};
  sorted.forEach(e=>{
    const m=new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(!months[m])months[m]=[];
    months[m].push(e);
  });

  Object.entries(months).forEach(([month,exams])=>{
    const md=exams.filter(e=>e.done).length;
    html+=`<div class="phase-hd" style="margin-top:0.25rem"><span class="phase-name">${month}</span><span class="phase-pct">${md}/${exams.length}</span></div>
    <div class="card" style="margin-bottom:1.5rem">`;
    html+=exams.map((e,i)=>{
      const dd=Math.ceil((new Date(e.date)-now)/864e5);
      const pc=e.done?'pill-done':dd<0?'pill-done':dd<=7?'pill-urgent':'pill-normal';
      const pt=e.done?'✓':dd<0?'Past':dd===0?'Today':dd+'d';
      const cc=courseColor(e.course);
      return`<div class="list-row" style="${e.done?'opacity:0.55':''}">
        <div style="width:3px;min-height:36px;border-radius:2px;background:${cc};flex-shrink:0;align-self:stretch;margin:2px 0"></div>
        <div class="pill ${pc}" style="min-width:44px;flex-shrink:0">${pt}</div>
        <div class="list-main">
          <div class="list-title${e.done?' done-text':''}">${esc(e.course)} <span style="font-weight:400;color:var(--text2)">— ${esc(e.type)}</span></div>
          <div class="list-meta">${fmt(e.date)}${e.time?' &middot; '+esc(e.time):''}${e.location?' &middot; '+esc(e.location):''}</div>
          ${e.notes?`<div class="list-meta" style="font-style:italic;margin-top:2px">${esc(e.notes)}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          <button class="btn btn-outline" style="padding:3px 10px;font-size:11px;${e.done?'background:var(--ok-l);color:var(--ok);border-color:var(--ok)':''}" onclick="toggleDone('${e.id}')">${e.done?'✓ Done':'Mark done'}</button>
          <button class="btn-edit" onclick="openModal('exam','${e.id}')"><i class="ti ti-pencil"></i></button>
          <button class="btn-ghost" onclick="delItem('exams','${e.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('');
    html+='</div>';
  });
  return html;
}

/* ---- SIDEBAR COLLAPSE (desktop) ---- */
function toggleSidebarCollapse(){
  const aside = document.getElementById('sidebar');

/* ---- MOBILE NAV ---- */
let navHistory=[];
function toggleSidebar(){
  const aside=document.getElementById('sidebar');
  const overlay=document.getElementById('sidebarOverlay');
  const btn=document.getElementById('mobMenu');
  aside.classList.toggle('open');
  overlay.classList.toggle('open');
  btn.classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.getElementById('mobMenu').classList.remove('open');
}
function mobGoBack(){
  if(navHistory.length>1){
    navHistory.pop();
    navigate(navHistory[navHistory.length-1],true);
  }
}
function updateMobHeader(t){
  const titleEl=document.getElementById('mobTitle');
  const backBtn=document.getElementById('mobBack');
  if(titleEl) titleEl.textContent=TABS[t]?.label||'Portfolio';
  if(backBtn){navHistory.length>1?backBtn.classList.add('visible'):backBtn.classList.remove('visible');}
}

function navigate(t,isBack=false){
  tab=t;
  if(!isBack&&navHistory[navHistory.length-1]!==t) navHistory.push(t);
  closeSidebar();
  updateMobHeader(t);
  document.querySelectorAll('.n-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  document.getElementById('main').innerHTML=TABS[t].render();
  document.getElementById('main').scrollTop=0;
}

        ${ftxt('Notes (optional)','f_enotes',item?.notes||'')}`,
      save:()=>{
        if(!val('f_course'))return;
        const updated={id:item?.id||uid(),course:val('f_course'),type:val('f_type'),date:val('f_edate'),time:val('f_time'),location:val('f_eloc'),notes:val('f_enotes'),done:item?.done||false};
        if(isEdit){state.exams=state.exams.map(x=>x.id===id?updated:x);}
        else{state.exams.push(updated);state.exams.sort((a,b)=>new Date(a.date)-new Date(b.date));}
        save();closeModal();navigate(tab);
      }
    },
    portfolio:{
      title:isEdit?'Edit scholarly output':'Add scholarly output',
      body:`
        ${fsel('Type','f_ptype',PORTFOLIO_TYPES,item?.type||'')}
        ${fld('Title','f_ptitle','text','',item?.title||'')}
        ${fld('Venue / Journal / Conference','f_pvenue','text','',item?.venue||'')}
        <div class="f-row">${fld('Date','f_pdate','date','',item?.date||'')}${fsel('Status','f_pstatus',['In Progress','Submitted','Under Review','Accepted','Published','Presented'],item?.status||'')}</div>
        ${ftxt('Notes (optional)','f_pnotes',item?.notes||'')}`,
      save:()=>{
        if(!val('f_ptitle'))return;
        const updated={id:item?.id||uid(),type:val('f_ptype')||'Research Experience',title:val('f_ptitle'),venue:val('f_pvenue'),date:val('f_pdate'),status:val('f_pstatus')||'In Progress',notes:val('f_pnotes')};
        if(isEdit){state.portfolio=state.portfolio.map(x=>x.id===id?updated:x);}else{state.portfolio.push(updated);}
        save();closeModal();navigate(tab);
      }
    },
    signal:{
      title:isEdit?'Edit signal program':'Add signal program',
      body:`
        ${fld('Program / department name','f_sname','text','',item?.program||'')}
        <div class="f-row">${fld('Institution / hospital','f_sinst','text','',item?.institution||'')}${fld('State','f_sstate','text','',item?.state||'')}</div>
        <div class="f-row">${fsel('Signal type','f_ssig',['Gold','Silver','Undecided','None'],item?.signal||'')}${fsel('DO-friendly?','f_sdo',['Yes — confirmed history','Likely','Unknown','No'],item?.doFriendly||'')}</div>
        ${fsel('Away rotation status','f_saway',['Completed','Planned M4','N/A'],item?.awayRotation||'')}
        ${fld('Faculty contact / connection','f_sfac','text','',item?.facultyContact||'')}
        ${ftxt('Notes','f_snotes',item?.notes||'')}`,
      save:()=>{
        if(!val('f_sname'))return;
        const updated={id:item?.id||uid(),program:val('f_sname'),institution:val('f_sinst'),state:val('f_sstate'),signal:val('f_ssig')||'Undecided',doFriendly:val('f_sdo'),awayRotation:val('f_saway')||'N/A',facultyContact:val('f_sfac'),notes:val('f_snotes')};
        if(isEdit){state.signals=state.signals.map(x=>x.id===id?updated:x);}else{state.signals.push(updated);}
        save();closeModal();navigate(tab);
      }
    },
    prelim:{
      title:isEdit?'Edit prelim program':'Add prelim program',
      body:`
        ${fld('Program / department name','f_prname','text','',item?.program||'')}
        <div class="f-row">${fld('Institution','f_prinst','text','',item?.institution||'')}${fld('State','f_prstate','text','',item?.state||'')}</div>
        <div class="f-row">${fsel('Type','f_prtype',['Preliminary IM','Transitional Year'],item?.type||'')}${fsel('Status','f_prstatus',['Researching','Planning to Apply','Applied','Interviewed','Ranked'],item?.status||'')}</div>
        ${fld('Rank position (if ranked)','f_prrank','number','',item?.rank||'')}
        ${ftxt('Notes','f_prnotes',item?.notes||'')}`,
      save:()=>{
        if(!val('f_prname'))return;
        const s=val('f_prstatus')||'Researching';
        const updated={id:item?.id||uid(),program:val('f_prname'),institution:val('f_prinst'),state:val('f_prstate'),type:val('f_prtype')||'Preliminary IM',status:s,rank:val('f_prrank'),notes:val('f_prnotes')};
        if(isEdit){state.prelim=state.prelim.map(x=>x.id===id?updated:x);}else{state.prelim.push(updated);}
        save();closeModal();navigate(tab);
      }
    },
  };
  const c=configs[type];
  if(c) openOverlay(c.title,c.body,c.save);
}

/* ---- SIDEBAR INIT ---- */
function initSidebar(){
  // Journey timeline
  const stops=[
    {label:'M1',date:'Aug 2025 – Jun 2026',now:false},
    {label:'M2',date:'Jul 2026 – Jun 2027',now:true},
    {label:'M3',date:'Jul 2027 – Jun 2028',now:false},
    {label:'M4',date:'Jul 2028 – Feb 2029',now:false},
    {label:'Match Day',date:'Mar 16, 2029*',now:false},
  ];
  document.getElementById('jWrap').innerHTML=stops.map(s=>`
    <div class="j-stop${s.now?' now':''}">
      <div class="j-dot"></div>
      <div class="j-lbl">${s.label}</div>
      <div class="j-date">${s.date}</div>
    </div>`).join('')+`<div style="font-size:9px;color:var(--sb-dim);opacity:0.6;margin-top:6px;line-height:1.4">*Estimated — NRMP hasn't published the official 2029 date yet; Match Day is always the third Friday of March.</div>`;

  // Countdown — estimated 2029 Match Day (third Friday of March, NRMP's
  // consistent pattern); update once NRMP publishes the official date.
  const days=Math.max(0,Math.ceil((new Date('2029-03-16')-new Date())/864e5));
  document.getElementById('cdNum').textContent=days.toLocaleString();

  // Nav
  const navGroups=[
    {label:'Profile',items:['home','dashboard','schedule','studyLog']},
    {label:'Academic',items:['goals','research','portfolio','shadowing','communityService','conferences','publications','externalPrograms','leadership']},
    {label:'Application',items:['boards','lors','awards','signals','prelim']},
  ];
  document.getElementById('nav').innerHTML=navGroups.map(g=>`
    <div class="n-sect">${g.label}</div>
    ${g.items.map(k=>`<button class="n-item${tab===k?' active':''}" data-tab="${k}" onclick="navigate('${k}')">
      <i class="ti ${TABS[k].icon}"></i>${TABS[k].label}
    </button>`).join('')}
  `).join('')+`
    <div class="n-sect" style="margin-top:0.5rem">Data & Sync</div>
    <div id="sbStatus" style="margin:0 1rem 8px;padding:7px 10px;border-radius:7px;font-size:11px;font-family:'Inter',sans-serif;background:rgba(106,138,104,0.12);border:1px solid rgba(106,138,104,0.3);color:#8DB88A;display:flex;align-items:center;gap:6px">
      <i class="ti ti-cloud-check" style="font-size:13px"></i><span>Supabase connected</span>
    </div>
    <div style="padding:0.5rem 1rem 0.75rem;display:flex;flex-direction:column;gap:7px">
      <div style="display:flex;gap:6px">
        <button onclick="exportData()" title="Export Backup" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.04);color:var(--sb-dim);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s" onmouseover="this.style.background='rgba(255,255,255,0.09)';this.style.color='var(--sb-text)'" onmouseout="this.style.background='rgba(255,255,255,0.04)';this.style.color='var(--sb-dim)'">
          <i class="ti ti-download" style="font-size:13px"></i>Export
        </button>
        <button onclick="importData()" title="Import Backup" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.04);color:var(--sb-dim);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s" onmouseover="this.style.background='rgba(255,255,255,0.09)';this.style.color='var(--sb-text)'" onmouseout="this.style.background='rgba(255,255,255,0.04)';this.style.color='var(--sb-dim)'">
          <i class="ti ti-upload" style="font-size:13px"></i>Import
        </button>
      </div>
    </div>
  `;
}

/* ---- INIT ---- */
window.addEventListener('DOMContentLoaded',async()=>{
  await load();
  initSidebar();
  navigate('home');
  // Restore sidebar collapsed state
  if(localStorage.getItem('sidebar_collapsed')==='true'){
    const aside=document.getElementById('sidebar');
    const icon=document.getElementById('collapseIcon');
    if(aside){aside.classList.add('collapsed');}
    if(icon){icon.className='ti ti-layout-sidebar-left-expand';}
  }
  document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
});
</script>
